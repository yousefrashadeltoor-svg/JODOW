name: JODOW Android archive audit and build

on:
  workflow_dispatch:
  push:
    branches:
      - audit/android-build-matrix-2026-11-16

permissions:
  contents: read

jobs:
  build:
    name: "Archive ${{ matrix.id }} — ${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "01"
            archive: "---3 (1).zip"
            label: "Aurora Get — candidate 01"
          - id: "02"
            archive: "---3.zip"
            label: "Aurora Get — candidate 02"
          - id: "03"
            archive: "aurora-get-android-development.zip"
            label: "Aurora Get — Android development"
          - id: "04"
            archive: "aurora-get-app-development (1).zip"
            label: "Aurora Get — app development 1"
          - id: "05"
            archive: "aurora-get-app-development (2).zip"
            label: "Aurora Get — app development 2"
          - id: "06"
            archive: "aurora-get-app-development (3).zip"
            label: "JoDon — candidate 06"
          - id: "07"
            archive: "aurora-get-app-development (4).zip"
            label: "Aurora Get — candidate 07"
          - id: "08"
            archive: "aurora-get-app-development (5).zip"
            label: "Aurora Get — candidate 08"
          - id: "09"
            archive: "aurora-get-app-development.zip"
            label: "Aurora Get — app development"
          - id: "10"
            archive: "jo-dow-android-development.zip"
            label: "JoDow — Android development"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract and identify native Android modules
        id: prepare
        shell: bash
        env:
          ARCHIVE: "${{ matrix.archive }}"
          APP_ID: "${{ matrix.id }}"
          APP_LABEL: "${{ matrix.label }}"
        run: |
          set -euo pipefail
          mkdir -p "work/${APP_ID}/out" "work/${APP_ID}/source"
          python3 - "${ARCHIVE}" "work/${APP_ID}/source" <<'PY'
          import json, os, sys, zipfile
          archive, dest = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")
              base = os.path.realpath(dest)
              for item in z.infolist():
                  target = os.path.realpath(os.path.join(dest, item.filename))
                  if target != base and not target.startswith(base + os.sep):
                      raise SystemExit(f"Unsafe ZIP path rejected: {item.filename}")
                  z.extract(item, dest)
          PY

          python3 - "${APP_ID}" "${APP_LABEL}" "work/${APP_ID}/source" "work/${APP_ID}/out/report.json" "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib, re, sys
          app_id, label, source, report_path, output_path = sys.argv[1:]
          src = pathlib.Path(source).resolve()
          settings = [p for p in src.rglob("settings.gradle") if ".gradle" not in p.parts]
          settings += [p for p in src.rglob("settings.gradle.kts") if ".gradle" not in p.parts]
          candidates = []
          for sf in settings:
              root = sf.parent
              mods = {}
              for manifest in root.rglob("src/main/AndroidManifest.xml"):
                  if any(x in manifest.parts for x in (".gradle", "build")):
                      continue
                  module_dir = manifest.parent.parent.parent
                  build_file = next((d / n for d in [module_dir, *module_dir.parents[:max(0, len(module_dir.parents)-len(root.parents))]] for n in ("build.gradle.kts", "build.gradle") if (d / n).is_file()), None)
                  if not build_file:
                      continue
                  try:
                      rel = build_file.parent.relative_to(root)
                  except ValueError:
                      continue
                  module = ":" + ":".join(rel.parts) if rel.parts else ":"
                  txt = build_file.read_text(errors="ignore")
                  if "com.android.library" in txt and "com.android.application" not in txt:
                      continue
                  mods[module] = str(build_file)
              # Also recognize application modules whose manifest is generated or declared in a custom location.
              for bf in list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts")):
                  if any(x in bf.parts for x in (".gradle", "build")):
                      continue
                  txt = bf.read_text(errors="ignore")
                  if re.search(r"com\\.android\\.application|android\\.application", txt):
                      try: rel = bf.parent.relative_to(root)
                      except ValueError: continue
                      module = ":" + ":".join(rel.parts) if rel.parts else ":"
                      mods.setdefault(module, str(bf))
              candidates.append((len(mods), root, mods, sf))
          if candidates:
              _, root, mods, sf = max(candidates, key=lambda x: (x[0], -len(str(x[1]))))
              if mods:
                  modules = sorted(mods)
                  report = {
                      "id": app_id, "label": label, "status": "PROJECTS_DETECTED",
                      "gradle_root": str(root.relative_to(src)),
                      "application_modules": modules,
                      "module_build_files": mods,
                      "settings_file": str(sf.relative_to(src))
                  }
                  with open(report_path, "w") as f: json.dump(report, f, indent=2)
                  with open(output_path, "a") as f:
                      f.write("ready=true\\n")
                      f.write(f"android_root={root}\\n")
                      f.write("modules=" + ",".join(modules) + "\\n")
                  print(json.dumps(report, indent=2))
                  raise SystemExit(0)
          report = {
              "id": app_id, "label": label,
              "status": "NO_ANDROID_APPLICATION_MODULE",
              "detail": "No Gradle application module with a source manifest or Android application plugin was found.",
              "settings_files": [str(p.relative_to(src)) for p in settings],
              "android_manifests": [str(p.relative_to(src)) for p in src.rglob("AndroidManifest.xml") if ".gradle" not in p.parts and "build" not in p.parts][:100]
          }
          with open(report_path, "w") as f: json.dump(report, f, indent=2)
          with open(output_path, "a") as f: f.write("ready=false\\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Assemble detected Android application modules and run unit tests
        id: build
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        env:
          ANDROID_ROOT: "${{ steps.prepare.outputs.android_root }}"
          MODULES: "${{ steps.prepare.outputs.modules }}"
          APP_ID: "${{ matrix.id }}"
          APP_LABEL: "${{ matrix.label }}"
        run: |
          set +e
          mkdir -p "work/${APP_ID}/out"
          build_rc=0
          test_rc=0
          apk_count=0
          verified_count=0
          : > "work/${APP_ID}/out/build.log"
          IFS=',' read -ra module_list <<< "${MODULES}"
          for module in "${module_list[@]}"; do
            task="${module}:assembleDebug"
            echo "=== Building ${task} ===" | tee -a "work/${APP_ID}/out/build.log"
            gradle -p "${ANDROID_ROOT}" --no-daemon --stacktrace "${task}" >> "work/${APP_ID}/out/build.log" 2>&1
            rc=$?
            if [[ $rc -ne 0 ]]; then build_rc=$rc; fi
            if [[ $rc -eq 0 ]]; then
              test_task="${module}:testDebugUnitTest"
              echo "=== Testing ${test_task} ===" | tee -a "work/${APP_ID}/out/build.log"
              gradle -p "${ANDROID_ROOT}" --no-daemon --stacktrace "${test_task}" >> "work/${APP_ID}/out/build.log" 2>&1
              trc=$?
              if [[ $trc -ne 0 ]]; then test_rc=$trc; fi
            else
              test_rc=125
            fi
          done

          while IFS= read -r -d '' apk; do
            apk_count=$((apk_count + 1))
            dest="work/${APP_ID}/out/${APP_ID}-$(basename "$apk")"
            cp "$apk" "$dest"
            if unzip -t "$dest" >/dev/null 2>&1 && "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$dest" >> "work/${APP_ID}/out/validation.log" 2>&1; then
              if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$dest" >> "work/${APP_ID}/out/validation.log" 2>&1; then
                verified_count=$((verified_count + 1))
              fi
            fi
          done < <(find "${ANDROID_ROOT}" -type f -path '*/build/outputs/apk/*' -name '*.apk' -print0 2>/dev/null)

          status="BUILD_FAILED"
          if [[ $build_rc -eq 0 && $test_rc -eq 0 && $apk_count -gt 0 && $verified_count -eq $apk_count ]]; then
            status="BUILD_TESTS_AND_APK_VALIDATION_PASSED"
          elif [[ $build_rc -eq 0 && $apk_count -gt 0 ]]; then
            status="APK_BUILT_WITH_TEST_OR_VALIDATION_ISSUES"
          elif [[ $build_rc -eq 0 ]]; then
            status="BUILD_FINISHED_WITHOUT_APK"
          fi

          python3 - "${APP_ID}" "${APP_LABEL}" "$status" "$build_rc" "$test_rc" "$apk_count" "$verified_count" <<'PY'
          import json, sys
          app_id, label, status, build_rc, test_rc, apk_count, verified = sys.argv[1:]
          report = {
            "id": app_id, "label": label, "status": status,
            "assemble_exit_code": int(build_rc),
            "unit_test_exit_code": int(test_rc),
            "apk_count": int(apk_count),
            "apk_validated_count": int(verified),
            "apk_generated": int(apk_count) > 0
          }
          with open(f"work/{app_id}/out/report.json", "w", encoding="utf-8") as f:
            json.dump(report, f, ensure_ascii=False, indent=2)
          PY
          tail -n 120 "work/${APP_ID}/out/build.log"
          echo "Final status: ${status}; APK files: ${apk_count}; verified: ${verified_count}"

      - name: Upload per-archive build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "jodow-${{ matrix.id }}-evidence"
          path: "work/${{ matrix.id }}/out/"
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

  package:
    name: Collect APKs and audit reports
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Download all per-archive evidence
        uses: actions/download-artifact@v4
        with:
          pattern: "jodow-*-evidence"
          path: evidence
          merge-multiple: false

      - name: Assemble ordered delivery package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, shutil, glob, zipfile
          os.makedirs("delivery/APK", exist_ok=True)
          os.makedirs("delivery/Reports", exist_ok=True)
          reports = []
          for path in sorted(glob.glob("evidence/**/report.json", recursive=True)):
              with open(path, encoding="utf-8") as f:
                  report = json.load(f)
              reports.append(report)
              app_id = report.get("id", "unknown")
              with open(f"delivery/Reports/{app_id}-report.json", "w", encoding="utf-8") as f:
                  json.dump(report, f, ensure_ascii=False, indent=2)
              for apk in glob.glob(os.path.join(os.path.dirname(path), "*.apk")):
                  shutil.copy2(apk, f"delivery/APK/{os.path.basename(apk)}")
              for logname in ("build.log", "validation.log"):
                  log = os.path.join(os.path.dirname(path), logname)
                  if os.path.isfile(log):
                      shutil.copy2(log, f"delivery/Reports/{app_id}-{logname}")
          reports.sort(key=lambda r: r.get("id", ""))
          with open("delivery/BUILD-STATUS.json", "w", encoding="utf-8") as f:
              json.dump(reports, f, ensure_ascii=False, indent=2)
          with open("delivery/README.txt", "w", encoding="utf-8") as f:
              f.write("JODOW Android archive build package\\n")
              f.write("APK files are included only when an actual native build produced them.\\n")
              f.write("See BUILD-STATUS.json and Reports for build and validation status.\\n\\n")
              for r in reports:
                  f.write(f"{r.get('id')} — {r.get('label')}: {r.get('status')}\\n")
          with zipfile.ZipFile("JODOW-Android-APKs-and-Reports.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for root, _, files in os.walk("delivery"):
                  for name in files:
                      p = os.path.join(root, name)
                      z.write(p, os.path.relpath(p, "delivery"))
          print("Build results:")
          for r in reports:
              print(r.get("id"), r.get("status"), "APKs:", r.get("apk_count", 0))
          print("Total APKs:", len(glob.glob("delivery/APK/*.apk")))
          PY

      - name: Upload ordered delivery package
        uses: actions/upload-artifact@v4
        with:
          name: JODOW-Android-APKs-and-Reports
          path: |
            JODOW-Android-APKs-and-Reports.zip
            delivery/
          compression-level: 9
          retention-days: 30
